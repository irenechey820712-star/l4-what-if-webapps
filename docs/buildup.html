function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
function st(k){ state[k] = state[k] || {inp:{}, s2:{}, graded:{}}; return state[k]; }

function norm(s){
  return (s||"").toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"')
    .replace(/(\d),(\d{3})/g,"$1$2")
    .replace(/\s+/g," ").replace(/[.!?]+$/,"").trim();
}
function scoreOf(val, B, full){
  const v = norm(val);
  if(!v) return 0;
  if(B.a.some(x => norm(x) === v)) return full;
  for(const [x,p] of (B.p||[])) if(norm(x) === v) return p;
  return 0;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function width(B){ return Math.max(5, ...B.a.map(x => x.length + 2)); }
function shuffleIdx(n, seed){
  const a = [...Array(n).keys()];
  let s = seed * 9301 + 49297;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for(let t = 0; t < 10; t++){
    for(let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i],a[j]] = [a[j],a[i]]; }
    if(a.some((v,i) => v !== i)) break;
  }
  return a;
}

function blankHTML(key, n, isKr){
  const B = SETS[key].blanks[n];
  const v = st(key).inp["b"+n] || "";
  return `<span class="blank" id="w-${key}-${n}"><span class="no">(${n})</span>`+
    `<input id="${key}-b${n}" data-n="${n}" ${isKr?'data-kr="1"':''} size="${width(B)}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${n}번 빈칸">`+
    `<span class="mark"></span><span class="reveal">→ ${esc(B.a[0])}</span></span>`;
}
function lineHTML(key, L){
  const isKr = L.t !== "en";
  const body = esc(L.text).replace(/\[\[(\d+)\]\]/g, (_,n) => blankHTML(key, +n, isKr));
  if(L.t === "en"){
    return `<div class="ln en"><span class="src">${L.src}</span><span class="entext">${body}</span>`+
      `<span class="hint">${esc(L.hint)} <button class="krbtn" type="button">해석 보기</button></span>`+

  return `<div class="ln ${L.t}">${L.lab?`<span class="lab">${L.lab}</span>`:""}${body}</div>`;
}

    h += `<div class="q" data-q="${qi}"><div class="qh">${Q.n}.<span class="src">${Q.src}</span><span class="kr">${esc(Q.kr)}</span></div>`+
      `<div class="link">↳ ${Q.link}의 낱말과 이어져요</div>`+
      `<div class="build">${esc(Q.pre)} <span class="slot" id="slot-${qi}"></span>${esc(Q.post)}</div>`+
      `<div class="pool" id="pool-${qi}"></div>`+
      `<div class="row" style="margin-top:8px"><button class="btn sub" data-reset2="${qi}">다시 놓기</button><span class="fb" id="fb-${qi}"></span></div></div>`;
  });
  h += `</section><div class="row"><button class="btn" data-grade="2">STEP 2 채점</button>`+
       `<button class="btn sub" data-show="2" disabled>정답 문장 보기</button><span class="result" id="r2"></span></div>`;

  // STEP 3
  h += `<div class="steptitle"><span class="pill">STEP 3</span><h3>한 줄 요약</h3><span class="pts">25~26번 · 각 10점</span></div>`+
    `<section class="card s3"><p class="flow">차시 전체를 영어 한 문장으로 요약했어요. 빈칸에 알맞은 말을 쓰세요.</p>`;
  S.step3.forEach((Q, qi) => {
    const txt = esc(Q.text).replace(/\((ⓐ|ⓑ|ⓒ)\)/g, (_,k) => {
      const B = Q.bk[k], v = ST.inp[`s${Q.n}${k}`] || "";
      return `<span class="bk" id="w3-${Q.n}${k}"><span class="no">${k}</span><input id="${cur}-s${Q.n}${k}" data-s3="${Q.n}${k}" size="${width(B)+1}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${Q.n}번 ${k}">`+
        `<span class="mark"></span><span class="reveal">→ ${esc(B.a[0])}</span></span>`;
    });
    const hints = Object.entries(Q.bk).map(([k,B]) => `${k} ${B.hint} [${B.pts}점]`).join("   ");
    h += `<div class="q"><div class="qh">${Q.n}.<span class="src">${Q.lab}</span></div><div class="text">${txt}</div><div class="hints">${hints}</div></div>`;
  });
  h += `</section><div class="row"><button class="btn" data-grade="3">STEP 3 채점</button>`+
       `<button class="btn sub" data-show="3" disabled>틀린 칸 정답 보기</button><span class="result" id="r3"></span></div>`;
  h += `<p class="note">영어 문장은 지문 설계도(Lesson 4)의 원문 그대로이고 빈칸·배열만 적용했어요. STEP 3 요약문은 지문 내용을 바탕으로 한 자체 요약이에요. 풀이 내용은 이 기기 브라우저에 자동 저장돼요.</p>`;

  app.innerHTML = h;
  S.step2.forEach((Q, qi) => drawStep2(qi));
  markChips();
  // 저장된 채점 상태 복원
  [1,2,3].forEach(s => { if(ST.graded[s]) grade(s, true); });
  updateBar();
}

/* ------------------------------ STEP 2 ------------------------------ */
function drawStep2(qi){
  const Q = SETS[cur].step2[qi], ST = st(cur);
  const placed = ST.s2[qi] || [];
  const order = shuffleIdx(Q.chunks.length, Q.n);
  const slot = document.getElementById("slot-"+qi), pool = document.getElementById("pool-"+qi);
  slot.innerHTML = placed.map(i => `<button class="tile" type="button" data-q="${qi}" data-i="${i}" data-in="1">${esc(Q.chunks[i])}</button>`).join("");
  pool.innerHTML = order.filter(i => !placed.includes(i))
    .map(i => `<button class="tile" type="button" data-q="${qi}" data-i="${i}">${esc(Q.chunks[i])}</button>`).join("");
  slot.classList.remove("okb");
  document.getElementById("fb-"+qi).textContent = "";
  document.getElementById("fb-"+qi).className = "fb";
}
function score2(qi){
  const Q = SETS[cur].step2[qi], placed = st(cur).s2[qi] || [];
  if(placed.length < Q.chunks.length) return {pts:0, msg:"덩어리를 모두 놓아야 채점돼요", cls:"ng"};
  const wrong = placed.filter((v,i) => v !== i).length;
  if(wrong === 0) return {pts:5, msg:"✓ 정답 (5점)", cls:"ok"};
  if(wrong <= 2) return {pts:2, msg:"△ 덩어리 하나만 자리가 달라요 (2점)", cls:"part"};
  return {pts:0, msg:`✗ ${wrong}개 덩어리의 자리가 달라요 (0점)`, cls:"ng"};
}

/* ------------------------------ 채점 ------------------------------ */
function setMark(wrap, got, full){
  wrap.classList.remove("ok","ng","part");
  const m = wrap.querySelector(".mark");
  if(got === full){ wrap.classList.add("ok"); m.textContent = "✓"; }
  else if(got > 0){ wrap.classList.add("part"); m.textContent = `△${got}`; }
  else { wrap.classList.add("ng"); m.textContent = "✗"; }
}
function clearMarks(sel){
  document.querySelectorAll(sel).forEach(w => { w.classList.remove("ok","ng","part"); const m = w.querySelector(".mark"); if(m) m.textContent = ""; });
}
function grade(step, silent){
  const S = SETS[cur], ST = st(cur);
  let tot = 0;
  if(step === 1){
    for(let n = 1; n <= 20; n++){
      const got = scoreOf(ST.inp["b"+n], S.blanks[n], 3);
      tot += got;
      setMark(document.getElementById(`w-${cur}-${n}`), got, 3);
    }
    document.getElementById("r1").textContent = `STEP 1: ${tot} / 60점`;
  }
  if(step === 2){
    S.step2.forEach((Q, qi) => {
      const r = score2(qi);
      tot += r.pts;
      const fb = document.getElementById("fb-"+qi);
      fb.textContent = r.msg; fb.className = "fb " + r.cls;
      document.getElementById("slot-"+qi).classList.toggle("okb", r.cls === "ok");
    });
    document.getElementById("r2").textContent = `STEP 2: ${tot} / 20점`;
  }
  if(step === 3){
    S.step3.forEach(Q => {
      Object.entries(Q.bk).forEach(([k,B]) => {
        const got = scoreOf(ST.inp[`s${Q.n}${k}`], B, B.pts);
        tot += got;
        setMark(document.getElementById(`w3-${Q.n}${k}`), got, B.pts);
      });
    });
    document.getElementById("r3").textContent = `STEP 3: ${tot} / 20점`;
  }
  ST.graded[step] = tot;
  const sb = document.querySelector(`[data-show="${step}"]`);
  if(sb) sb.disabled = false;
  if(!silent) save();
  updateBar();
  return tot;
}
function updateBar(){
  const g = st(cur).graded;
  const f = s => (g[s] === undefined ? "-" : g[s]);
  document.getElementById("sc1").textContent = f(1);
  document.getElementById("sc2").textContent = f(2);
  document.getElementById("sc3").textContent = f(3);
  const all = [1,2,3].every(s => g[s] !== undefined);
  document.getElementById("sct").textContent = "합계 " + (all ? (g[1]+g[2]+g[3]) : "-") + "/100";
}
function ungrade(step){
  const ST = st(cur);
  if(ST.graded[step] === undefined) return;
  delete ST.graded[step];
  const r = document.getElementById("r"+step); if(r) r.textContent = "";
  if(step === 1) clearMarks(".blank");
  if(step === 3) clearMarks(".s3 .bk");
  updateBar();
}
function markChips(){
  document.querySelectorAll(".card[id^=part-]").forEach(card => {
    const vals = [...card.querySelectorAll("input[data-kr]")].map(i => norm(i.value));
    card.querySelectorAll(".chip").forEach(c => c.classList.toggle("used", vals.includes(norm(c.dataset.w))));
  });
}

/* ------------------------------ 이벤트 ------------------------------ */
app.addEventListener("input", e => {
  const t = e.target, ST = st(cur);
  if(t.dataset.n){ ST.inp["b"+t.dataset.n] = t.value; ungrade(1); markChips(); }
  if(t.dataset.s3){ ST.inp["s"+t.dataset.s3] = t.value; ungrade(3); }
  save();
});
app.addEventListener("focusin", e => { if(e.target.dataset && e.target.dataset.kr) lastKr = e.target; });
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  const ST = st(cur);
  if(t.classList.contains("krbtn")){
    const k = t.closest(".ln").querySelector(".krline");
    k.classList.toggle("show"); t.textContent = k.classList.contains("show") ? "해석 닫기" : "해석 보기"; return;
  }
  if(t.classList.contains("chip")){
    const card = t.closest(".card");
    let target = (lastKr && card.contains(lastKr)) ? lastKr : [...card.querySelectorAll("input[data-kr]")].find(i => !i.value);
    if(!target) return;
    target.value = t.dataset.w;
    target.dispatchEvent(new Event("input", {bubbles:true}));
    const all = [...card.querySelectorAll("input[data-kr]")];
    const next = all.slice(all.indexOf(target) + 1).find(i => !i.value);
    if(next){ next.focus(); lastKr = next; }
    return;
  }
  if(t.classList.contains("tile")){
    const qi = +t.dataset.q, i = +t.dataset.i;
    const arr = ST.s2[qi] = ST.s2[qi] || [];
    if(t.dataset.in){ arr.splice(arr.indexOf(i), 1); } else { arr.push(i); }
    ungrade(2); save(); drawStep2(qi); return;
  }
  if(t.dataset.reset2 !== undefined){ ST.s2[+t.dataset.reset2] = []; ungrade(2); save(); drawStep2(+t.dataset.reset2); return; }
  if(t.dataset.grade){ grade(+t.dataset.grade); return; }
  if(t.dataset.show){
    const step = +t.dataset.show;
    if(step === 2){
      SETS[cur].step2.forEach((Q, qi) => {
        const fb = document.getElementById("fb-"+qi);
        if(!fb.classList.contains("ok")) fb.textContent += `  →  ${Q.pre} ${Q.chunks.join(" ")}${Q.post === "…" ? " …" : Q.post}`;
      });
      t.disabled = true;
    } else {
      document.body.classList.toggle("showans");
      t.textContent = document.body.classList.contains("showans") ? "정답 숨기기" : "틀린 칸 정답 보기";
    }
  }
});

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  cur = b.dataset.set; state.cur = cur; save();
  document.body.classList.remove("showans"); lastKr = null;
  render(); window.scrollTo({top:0});
}));
document.getElementById("gradeAll").addEventListener("click", () => { grade(1); grade(2); grade(3); });
const FRAMED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
if(location.protocol !== "file:") document.querySelectorAll("a[data-alt]").forEach(a => a.href = a.dataset.alt);
if(FRAMED) document.getElementById("printBtn").style.display = "none";
document.getElementById("printBtn").addEventListener("click", () => window.print());
let resetArm = null;
document.getElementById("resetBtn").addEventListener("click", e => {
  const b = e.currentTarget;
  if(!resetArm){ b.textContent = "한 번 더 누르면 지워져요"; resetArm = setTimeout(() => { resetArm = null; b.textContent = "다시 풀기"; }, 3000); return; }
  clearTimeout(resetArm); resetArm = null; b.textContent = "다시 풀기";
  state[cur] = {inp:{}, s2:{}, graded:{}}; save(); document.body.classList.remove("showans"); render();
});
["cls","num","nm"].forEach(id => {
  const el = document.getElementById(id);
  el.value = (state.who || {})[id] || "";
  el.addEventListener("input", () => { state.who = state.who || {}; state.who[id] = el.value; save(); });
});

const hashSet = location.hash.slice(1);
if(SETS[hashSet]) state.cur = hashSet;
if(state.cur && SETS[state.cur]){
  cur = state.cur;
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.set === cur ? "true" : "false"));
}
render();
</script>
</body>
</html>
