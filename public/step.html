<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L4 What-If Science 한 걸음 학습지 (2-1반 · 2-4반)</title>
<style>
  :root{--navy:#1F3A5F;--navy2:#2d5285;--ink:#1e2430;--gray:#555;--light:#7a8494;--box:#F4F6FA;--head:#E8EDF5;
    --line:#d5dbe5;--ok:#1b7f4b;--okbg:#e3f5ea;--ng:#b83227;--ngbg:#fdecea;--warm:#f2b134;--warmbg:#fff6df;
    --subj:#2563c9;--verb:#c2412d;--key:#1f8a4c;--part:#7a3fb8;--etc:#5b6576}
  *{box-sizing:border-box}
  body{margin:0;background:#f1f4f9;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16.5px;line-height:1.7}
  .wrap{max-width:860px;margin:0 auto;padding:0 14px}
  header{background:linear-gradient(135deg,#1F3A5F,#2d5285);color:#fff;padding:20px 0 0}
  header .k{font-size:13px;opacity:.8}
  header h1{margin:3px 0 2px;font-size:25px}
  header p{margin:0;font-size:14.5px;opacity:.9}
  .who{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .who label{font-size:14px;background:rgba(255,255,255,.14);border-radius:8px;padding:3px 10px}
  .who input{width:64px;border:0;border-bottom:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:inherit;outline:none}
  .who input#nm{width:100px}
  .tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .tabs button{font:inherit;font-weight:800;border:0;border-radius:12px 12px 0 0;padding:9px 16px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
  .tabs button small{display:block;font-size:11.5px;font-weight:700;opacity:.85}
  .tabs button[aria-selected="true"]{background:#f1f4f9;color:var(--navy)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
  .steps button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;text-align:left;color:var(--ink)}
  .steps button b{display:block;color:var(--navy);font-size:15.5px}
  .steps button span{font-size:12.5px;color:var(--light)}
  .steps button[aria-selected="true"]{border-color:var(--navy);background:var(--head)}
  .steps button .pg{float:right;font-size:12.5px;font-weight:800;color:var(--ok)}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(20,30,50,.08);padding:18px 20px;margin:14px 0}
  .card h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
  .lead{font-size:14.5px;color:var(--gray);margin:0 0 10px}
  .tip{background:var(--warmbg);border:1px solid #f0d99a;border-radius:12px;padding:10px 14px;font-size:14.5px}
  .tip b{color:#8a5a00}
  .sw{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;user-select:none}
  .sec{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .sec .sh{background:var(--head);padding:8px 14px;font-weight:800;color:var(--navy);display:flex;gap:8px;align-items:center}
  .sec .sh .ok{margin-left:auto;color:var(--ok);font-size:13.5px}
  .sec .sb{padding:6px 14px 12px}
  .sec.locked .sb{display:none}
  .sec.locked .sh::after{content:"🔒 앞 문단 확인 문제를 풀면 열려요";margin-left:auto;font-size:13px;color:var(--light);font-weight:600}
  .sent{padding:8px 0;border-bottom:1px dashed var(--line);transition:background .4s}
  .sent:last-of-type{border-bottom:0}
  .sent.glow{background:#fff3c4;border-radius:8px}
  .sent .no{display:inline-block;min-width:24px;font-weight:900;color:var(--navy2)}
  .en{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px}
  .ck{display:inline-block;vertical-align:top;margin:0 1px}
  .ck .lb{display:none;font-family:Pretendard,"Malgun Gothic",sans-serif;font-size:10.5px;font-weight:800;line-height:1.2;text-align:center;border-radius:4px;padding:0 3px;color:#fff}
  .struct .ck .lb{display:block}
  .struct .ck{border-bottom:3px solid currentColor;padding:0 2px;margin:2px 2px}
  .r-subj{color:var(--subj)} .r-verb{color:var(--verb)} .r-key{color:var(--key)} .r-part{color:var(--part)} .r-etc{color:var(--etc)}
  .r-subj .lb{background:var(--subj)} .r-verb .lb{background:var(--verb)} .r-key .lb{background:var(--key)} .r-part .lb{background:var(--part)} .r-etc .lb{background:var(--etc)}
  .ck .tx{color:var(--ink)}
  .sl{color:#b6c0cf;margin:0 3px;font-weight:300}
  .struct .sl{display:none}
  .tools{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
  .mini{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 8px;cursor:pointer;color:var(--gray)}
  .kr{display:none;font-size:14.5px;color:#3d4a5c;background:#f7f9fc;border-radius:8px;padding:4px 10px;margin-top:4px}
  .kr.show{display:block}
  .chk{background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .chk .q{font-weight:800}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opt{font:inherit;text-align:left;border:1.5px solid #b8c4d6;background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .opt:hover{background:var(--head)}
  .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:800}
  .opt.wrong{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
  .msg{font-size:14.5px;font-weight:700;margin-top:6px;min-height:1em}
  .msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)} .msg.info{color:#8a5a00}
  .key{border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
  .key .kh{background:var(--head);padding:10px 14px}
  .key .kh b{color:var(--navy)}
  .key .kh .krt{display:block;font-size:15px;margin-top:2px}
  .rung{padding:12px 14px;border-top:1px solid var(--line);position:relative}
  .rung .rt{font-weight:800;color:var(--navy);font-size:14.5px;display:flex;gap:8px;align-items:center}
  .rung .rt .lv{background:var(--navy);color:#fff;border-radius:999px;padding:0 9px;font-size:12.5px}
  .rung .rt .st{margin-left:auto;font-size:13px}
  .rung.locked{opacity:.38;pointer-events:none}
  .rung.locked .rt .st::after{content:"🔒"}
  .rung.done{background:#fbfefc}
  .line{margin-top:6px}
  .bl{display:inline-block;min-width:70px;border-bottom:2px solid #8aa0bf;background:#fff8d6;text-align:center;border-radius:4px 4px 0 0;padding:0 6px;color:#8a99ad}
  input.w{font:inherit;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;border:0;border-bottom:2px solid #8aa0bf;background:#fff8d6;border-radius:4px 4px 0 0;
    padding:1px 6px;outline:none;text-align:center;color:#13325c}
  input.w:focus{background:#fff1a8;border-bottom-color:var(--navy)}
  input.w.long{width:100%;text-align:left;margin:6px 0}
  .btn{font:inherit;font-size:14.5px;font-weight:800;border:0;border-radius:10px;padding:7px 16px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.sub{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.ghost{background:#fff;color:var(--gray);border:1px solid var(--line)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .slot{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;border-bottom:2px dashed #8aa0bf;padding:5px;background:#fffdf0;border-radius:8px 8px 0 0;margin-top:6px}
  .slot:empty::before{content:"아래 덩어리를 순서대로 누르세요";color:#aab;font-size:13.5px;align-self:center}
  .pool{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--box);border-radius:10px;margin-top:6px;min-height:48px}
  .tile{font:inherit;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;border:1.5px solid #9fb2cc;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;color:#13325c}
  .slot .tile{background:#e9f0fb;border-color:#6f8fbf}
  .diff span{display:inline-block;margin:0 2px;padding:0 3px;border-radius:4px}
  .diff .g{background:var(--okbg);color:var(--ok)} .diff .r{background:var(--ngbg);color:var(--ng);text-decoration:underline wavy}
  .passage{background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
  .passage .sent{border-bottom:0;padding:3px 0}
  .q3{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .q3 .qh{background:var(--head);padding:8px 14px;font-weight:800;color:var(--navy)}
  .q3 .qb{padding:10px 14px}
  .phase{font-size:13.5px;font-weight:800;color:#8a5a00;margin-top:6px}
  .nos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .nos button{font:inherit;font-weight:900;font-size:16px;border:1.5px solid #b8c4d6;background:#fff;border-radius:10px;width:44px;height:40px;cursor:pointer;color:var(--navy2)}
  .nos button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .nos button.wrong{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
  .hide{display:none!important}
  .cheer{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;font-weight:800;border-radius:999px;
    padding:10px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .35s;z-index:30}
  .cheer.show{transform:translateX(-50%) translateY(0)}
  .bar{height:10px;background:#dfe5ee;border-radius:999px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#3bb273,#1b7f4b);border-radius:999px;transition:width .4s}
  .note{font-size:12.5px;color:var(--light);margin:16px 0 30px}
  @media (max-width:600px){ .steps{grid-template-columns:1fr} header h1{font-size:21px} .card{padding:14px 12px} .en{font-size:16px} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="k">2026학년도 2학기 영어Ⅱ · Lesson 4 What-If Science · 2-1반 · 2-4반</div>

    <p>긴 지문은 덩어리로 끊어 읽고, 영어 문장은 사다리처럼 한 칸씩 올라가며 써요. 복합 문제는 쪼개서 풀어요.</p>
    <div class="who">

    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* 지문: 지문 설계도(Lesson 4 1~4차시)의 영어 원문·의미 덩어리·문장 성분·해석을 그대로 옮겼다. */

function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for(let t = 0; t < 10; t++){ for(let i = n - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i],a[j]] = [a[j],a[i]]; } if(a.some((v,i) => v !== i)) break; }
  return a;
}

function progress(k){
  const L = LES[k], s = st(k);
  const p1 = L.secs.filter((_,i) => s.sec[i]).length;
  const p2 = Object.values(s.rung).filter(v => v === "ok" || v === "seen").length;
  const p3 = L.cx.qs.filter((_,i) => (s.q3[i]||{}).done).length;
  return {p1, t1:L.secs.length, p2, t2:L.keys.length * 4, p3, t3:L.cx.qs.length};
}
function drawTabs(){
  document.getElementById("tabs").innerHTML = Object.entries(LES).map(([k,L]) => {
    const g = progress(k), done = g.p1 + g.p2 + g.p3, all = g.t1 + g.t2 + g.t3;
    return `<button role="tab" data-k="${k}" aria-selected="${k===cur}">${L.tab}<small>${L.sub} · ⭐ ${done}/${all}</small></button>`;
  }).join("");
}

/* ------------------------------ 그리기: 문장 ------------------------------ */
function sentHTML(s, opt = {}){
  let body = "", first = true;
  s.tk.forEach(x => {
    if(x.p !== undefined){ body += `<span class="tx">${esc(x.p)}</span>`; return; }
    body += `${first ? "" : `<span class="sl">/</span>`}<span class="ck r-${x.r}"><span class="lb">${esc(x.l)}</span><span class="tx">${esc(x.t)}</span></span> `;
    first = false;
  });
  return `<div class="sent" id="s-${cur}-${s.no}"><span class="no">${s.no}</span><span class="en">${body}</span>`+
    `<span class="tools"><button class="mini" data-say="${esc(plain(s.tk))}">🔊 듣기</button><button class="mini" data-kr>해석</button></span>`+
    `<div class="kr">${esc(s.kr)}</div></div>`;
}
function glow(no){
  const el = document.getElementById(`s-${cur}-${no}`) || document.getElementById(`p-${cur}-${no}`);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("glow"); setTimeout(() => el.classList.remove("glow"), 2600);
}

/* ------------------------------ STEP 1 끊어 읽기 ------------------------------ */
function step1(){
  const L = LES[cur], s = st(cur), M = sentMap(cur);
  let h = `<section class="card"><h2>STEP 1 · 끊어 읽기</h2>`+
    `<p class="lead">긴 지문을 문단별로 나눴어요. <b>/</b> 표시마다 끊어 읽고, 막히면 🔊 듣기와 해석을 눌러요. 문단 끝 확인 문제를 맞히면 다음 문단이 열려요.</p>`+
    `<label class="sw"><input type="checkbox" id="structSw" ${s.struct?"checked":""}> 문장 구조 보기 (주어·동사 색깔 표시)</label>`;
  L.secs.forEach((sec, i) => {
    const open = i === 0 || s.sec[i-1];
    const a = NUMS.indexOf(sec.a), b = NUMS.indexOf(sec.b);
    const ss = P[cur].filter(x => { const n = NUMS.indexOf(x.no); return n >= a && n <= b; });
    const solved = s.sec[i];
    h += `<div class="sec ${open?"":"locked"}"><div class="sh">문단 ${i+1} · ${sec.t} <span style="font-weight:600;color:var(--light);font-size:13px">${sec.a}${sec.a!==sec.b?"~"+sec.b:""}</span>${solved?'<span class="ok">✓ 통과</span>':""}</div><div class="sb ${s.struct?"struct":""}">`+
      ss.map(x => sentHTML(x)).join("")+
      `<div class="chk"><div class="q">확인 문제 · ${esc(sec.q)}</div><div class="opts">`+
      sec.o.map((o,j) => `<button class="opt ${solved && j===sec.ans?"right":""}" data-sec="${i}" data-j="${j}">${"①②③④"[j]} ${esc(o)}</button>`).join("")+
      `</div><div class="msg ${solved?"ok":""}" id="m1-${i}">${solved?"✓ 맞았어요! 근거: "+sec.ev+"번 문장":""}</div></div></div></div>`;
  });
  h += `</section>`;
  return h;
}

/* ------------------------------ STEP 2 쓰기 사다리 ------------------------------ */
const RN = ["고르기","단어 쓰기","덩어리 배열","핵심 부분 쓰기"];
function blankOut(full, w, rep){ const re = new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b"); return full.replace(re, rep); }
function rungState(ki, r){ return st(cur).rung[`${ki}-${r}`]; }
function step2(){
  const L = LES[cur], s = st(cur);
  let h = `<section class="card"><h2>STEP 2 · 쓰기 사다리</h2>`+
    `<p class="lead">핵심 문장 2개를 사다리처럼 한 칸씩 올라가며 써요. <b>고르기 → 단어 쓰기 → 덩어리 배열 → 핵심 부분 통째로 쓰기</b>. 두 번 틀리면 정답 보기가 열려요.</p>`;
  L.keys.forEach((K, ki) => {
    h += `<div class="key"><div class="kh"><b>핵심 문장 ${ki+1}</b> <span style="color:var(--light);font-size:13.5px">원문 ${K.no}</span>`+
      `<button class="mini" data-say="${esc(K.full)}" style="margin-left:6px">🔊 듣기</button><span class="krt">${esc(K.kr)}</span></div>`;
    for(let r = 0; r < 4; r++){
      const stt = rungState(ki, r), prevOk = r === 0 || rungState(ki, r-1);
      const tries = s.tries[`${ki}-${r}`] || 0;
      const lock = !prevOk && !stt;
      h += `<div class="rung ${lock?"locked":""} ${stt?"done":""}" data-k="${ki}" data-r="${r}"><div class="rt"><span class="lv">${r+1}칸</span>${RN[r]}`+
        `<span class="st">${stt==="ok"?"⭐ 성공":stt==="seen"?"👀 정답 확인":""}</span></div>`;
      if(r === 0){
        h += `<div class="line en">${esc(blankOut(K.full, K.r1.w, "\u0000")).replace("\u0000", `<span class="bl">?</span>`)}</div>`+
          `<div class="opts row">${K.r1.o.map(o => `<button class="opt ${stt && o===K.r1.w?"right":""}" data-r1="${esc(o)}">${esc(o)}</button>`).join("")}</div>`+
          `<div class="msg ${stt?"ok":""}">${stt?"✓ "+esc(K.r1.why):""}</div>`;
      }
      if(r === 1){
        const w = K.r2.w, ph = w[0] + " " + "_ ".repeat(w.length - 2) + w[w.length-1];
        const v = s.inp[`${ki}-1`] || (stt==="seen" ? w : "");
        h += `<div class="line en">${esc(blankOut(K.full, w, "\u0000")).replace("\u0000", `<input class="w" data-in="${ki}-1" size="${w.length+3}" placeholder="${ph}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false">`)}</div>`+
          `<div class="acts"><span style="font-size:14px;color:#8a5a00">뜻: ${esc(K.r2.mean)} · ${w.length}글자</span><button class="btn sub" data-chk="${ki}-1">확인</button>${tries>=2&&!stt?`<button class="btn ghost" data-see="${ki}-1">정답 보기</button>`:""}</div>`+
          `<div class="msg ${stt?"ok":""}" id="msg-${ki}-1">${stt?"✓ "+esc(w):""}</div>`;
      }
      if(r === 2){
        h += `<div class="slot" id="slot-${ki}"></div><div class="pool" id="pool-${ki}"></div>`+
          `<div class="acts"><button class="btn sub" data-chk="${ki}-2">확인</button><button class="btn ghost" data-clear="${ki}">다시 놓기</button>${tries>=2&&!stt?`<button class="btn ghost" data-see="${ki}-2">정답 보기</button>`:""}</div>`+
          `<div class="msg ${stt?"ok":""}" id="msg-${ki}-2">${stt?"✓ "+esc(K.full):""}</div>`;
      }
      if(r === 3){
        const v = s.inp[`${ki}-3`] || "";
        h += `<div style="font-size:14.5px;margin-top:4px">우리말 <b>‘${esc(K.r4.kr)}’</b>를 영어로 쓰세요. 앞뒤는 주어져 있어요.</div>`+
          `<div class="line en">${esc(K.r4.pre)} <span class="bl">?</span> ${esc(K.r4.post)}</div>`+
          `<input class="w long" data-in="${ki}-3" value="${esc(v)}" placeholder="여기에 영어로 쓰세요" autocomplete="off" autocapitalize="off" spellcheck="false">`+
          `<div class="acts"><button class="btn sub" data-chk="${ki}-3">확인</button><button class="btn ghost" data-first="${ki}">첫 낱말 힌트</button><button class="btn ghost" data-chunk="${ki}">낱말 카드 힌트</button>${tries>=2&&!stt?`<button class="btn ghost" data-see="${ki}-3">정답 보기</button>`:""}</div>`+
          `<div class="msg ${stt?"ok":""}" id="msg-${ki}-3">${stt?"✓ "+esc(K.r4.t):""}</div><div class="diff" id="diff-${ki}"></div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  });
  h += `</section>`;
  return h;
}
function drawTiles(ki){
  const K = LES[cur].keys[ki], s = st(cur), placed = s.tiles[ki] || [];
  const slot = document.getElementById("slot-"+ki), pool = document.getElementById("pool-"+ki);
  if(!slot) return;
  slot.innerHTML = placed.map(i => `<button class="tile" data-tile="${ki}" data-i="${i}" data-in-slot="1">${esc(K.r3[i])}</button>`).join("");
  pool.innerHTML = shuffled(K.r3.length, 7 + ki * 13 + (+cur) * 31).filter(i => !placed.includes(i)).map(i => `<button class="tile" data-tile="${ki}" data-i="${i}">${esc(K.r3[i])}</button>`).join("");
}
function addSee(btn, attr){
  const acts = btn.closest(".acts");
  if(acts && !acts.querySelector("[data-see],[data-q3see]")) acts.insertAdjacentHTML("beforeend", `<button class="btn ghost" ${attr}>정답 보기</button>`);
}
function lcsMark(a, b){
  const n = a.length, m = b.length, d = Array.from({length:n+1}, () => Array(m+1).fill(0));
  for(let i = n-1; i >= 0; i--) for(let j = m-1; j >= 0; j--) d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const hit = Array(n).fill(false); let i = 0, j = 0;
  while(i < n && j < m){ if(a[i] === b[j]){ hit[i] = true; i++; j++; } else if(d[i+1][j] >= d[i][j+1]) i++; else j++; }
  return {hit, common:d[0][0]};
}

/* ------------------------------ STEP 3 복합 문제 쪼개기 ------------------------------ */
function step3(){
  const L = LES[cur], s = st(cur), M = sentMap(cur), C = L.cx;
  let h = `<section class="card"><h2>STEP 3 · 복합 문제 쪼개기</h2>`+
    `<div class="tip"><b>복합 문제 푸는 3단계</b><br>① 지문보다 <b>문제를 먼저</b> 읽어요. → ② 답이 숨은 <b>근거 문장 번호</b>를 찾아요. → ③ 그 문장만 보고 답해요.</div>`+
    `<p class="lead" style="margin-top:10px">다음 글을 읽고 물음에 답하시오. <span style="color:var(--light)">(${L.pages} 원문)</span></p><div class="passage en">`;
  C.nos.forEach(no => {
    let t = plain(M[no].tk);
    C.alt.filter(a => a[0] === no).forEach(a => { t = t.replace(a[1], a[2]); });
    h += `<div class="sent" id="p-${cur}-${no}"><span class="no">${no}</span>${esc(t)}</div>`;
  });
  h += `</div>`;
  C.qs.forEach((Q, qi) => {
    const q = s.q3[qi] || {};
    h += `<div class="q3"><div class="qh">문제 ${qi+1}. ${esc(Q.q)}</div><div class="qb">`+
      `<div class="phase">1단계 · 이 문제의 근거 문장은 몇 번일까요?</div>`+
      `<div class="nos">${C.nos.map(no => `<button data-ev="${qi}" data-no="${no}" class="${q.found && no===Q.ev?"right":""}">${no}</button>`).join("")}</div>`+
      `<div class="msg ${q.found?"ok":""}" id="ev-${qi}">${q.found?"✓ 근거 문장을 찾았어요!":""}</div>`+
      `<div class="${q.found?"":"hide"}" id="ans-${qi}"><div class="phase">2단계 · 근거 문장을 보고 답하세요.</div>`;
    if(Q.k === "mcq"){
      h += `<div class="opts ${Q.o.length<=2?"row":""}">${Q.o.map((o,j) => `<button class="opt ${q.done && j===Q.ans?"right":""}" data-q3="${qi}" data-j="${j}">${"①②③④"[j]} ${esc(o)}</button>`).join("")}</div>`;
    } else {
      h += `<div class="acts"><input class="w" data-q3in="${qi}" size="14" value="${esc(q.v||"")}" autocomplete="off" autocapitalize="off" spellcheck="false">`+
        `<button class="btn sub" data-q3chk="${qi}">확인</button><button class="btn ghost" data-q3hint="${qi}">힌트</button>${(q.tries||0)>=2&&!q.done?`<button class="btn ghost" data-q3see="${qi}">정답 보기</button>`:""}</div>`;
    }
    h += `<div class="msg ${q.done?"ok":""}" id="q3m-${qi}">${q.done?"✓ 정답! "+esc(Q.why||""):""}</div></div></div></div>`;
  });
  const g = progress(cur);
  h += `<div class="card" style="background:var(--box);box-shadow:none;margin-top:16px"><b>오늘의 걸음</b> ⭐ ${g.p1+g.p2+g.p3} / ${g.t1+g.t2+g.t3}`+
    `<div class="bar"><i style="width:${(g.p1+g.p2+g.p3)/(g.t1+g.t2+g.t3)*100}%"></i></div>`+
    `<div style="font-size:14px;margin-top:6px;color:var(--gray)">끊어 읽기 ${g.p1}/${g.t1} · 쓰기 사다리 ${g.p2}/${g.t2} · 복합 문제 ${g.p3}/${g.t3}</div></div>`;
  h += `</section>`;
  return h;
}

/* ------------------------------ 전체 그리기 ------------------------------ */
function render(keepScroll){
  const L = LES[cur], s = st(cur), g = progress(cur), y = window.scrollY;
  let h = `<div class="steps">`+
    [["끊어 읽기", `문단 ${g.t1}개 · 확인 문제`, `${g.p1}/${g.t1}`],["쓰기 사다리","핵심 문장 2개 · 4칸씩",`${g.p2}/${g.t2}`],["복합 문제 쪼개기","근거 찾기 → 답하기",`${g.p3}/${g.t3}`]]
      .map((x,i) => `<button data-step="${i+1}" aria-selected="${s.step===i+1}"><span class="pg">${x[2]}</span><b>STEP ${i+1} · ${x[0]}</b><span>${x[1]}</span></button>`).join("")+
    `</div><div style="font-size:14.5px;color:var(--gray);margin:2px 0 0"><b style="color:var(--navy)">${L.tab}</b> ${esc(L.title)} <span style="color:var(--light)">(${L.pages})</span></div>`;
  h += s.step === 1 ? step1() : s.step === 2 ? step2() : step3();
  h += `<p class="note">영어 문장은 지문 설계도(Lesson 4)의 원문 그대로이고, 덩어리 나누기와 문장 성분 표시도 지문 설계도를 따랐어요. 풀이는 이 기기 브라우저에 자동 저장돼요.</p>`;
  app.innerHTML = h;
  if(s.step === 2) LES[cur].keys.forEach((_,ki) => drawTiles(ki));
  drawTabs();
  if(keepScroll) window.scrollTo(0, y);
}

/* ------------------------------ 이벤트 ------------------------------ */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  cur = b.dataset.k; S.cur = cur; save(); render(); window.scrollTo({top:0});
});
app.addEventListener("change", e => {
  if(e.target.id === "structSw"){ st(cur).struct = e.target.checked; save(); document.querySelectorAll(".sec .sb").forEach(x => x.classList.toggle("struct", e.target.checked)); }
});
app.addEventListener("input", e => {
  const t = e.target, s = st(cur);
  if(t.dataset.in){ s.inp[t.dataset.in] = t.value; save(); }
  if(t.dataset.q3in !== undefined){ (s.q3[t.dataset.q3in] = s.q3[t.dataset.q3in] || {}).v = t.value; save(); }
});
app.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const t = e.target;
  if(t.dataset.in) document.querySelector(`[data-chk="${t.dataset.in}"]`)?.click();
  if(t.dataset.q3in !== undefined) document.querySelector(`[data-q3chk="${t.dataset.q3in}"]`)?.click();
});
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const L = LES[cur], s = st(cur), d = b.dataset;
  if(d.step){ s.step = +d.step; save(); render(); window.scrollTo({top:0}); return; }
  if(d.say !== undefined){ speak(d.say); return; }
  if(d.kr !== undefined){ const k = b.closest(".sent").querySelector(".kr"); k.classList.toggle("show"); return; }

  // STEP 1 확인 문제
  if(d.sec !== undefined){
    const i = +d.sec, sec = L.secs[i], m = document.getElementById("m1-"+i);
    if(s.sec[i]) return;
    if(+d.j === sec.ans){
      s.sec[i] = 1; save(); good();
      b.classList.add("right"); m.className = "msg ok"; m.textContent = `✓ 맞았어요! 근거: ${sec.ev}번 문장` + (i < L.secs.length - 1 ? " · 다음 문단이 열렸어요 👇" : " · STEP 2로 가 볼까요?");
      setTimeout(() => render(true), 900);
    } else {
      b.classList.add("wrong"); m.className = "msg ng"; m.textContent = `다시 한번! ${sec.ev}번 문장을 다시 읽어 보세요 (노랗게 표시했어요).`;
      glow(sec.ev);
    }
    return;
  }

  // STEP 2
  if(d.r1 !== undefined){
    const rung = b.closest(".rung"), ki = +rung.dataset.k, K = L.keys[ki], m = rung.querySelector(".msg");
    if(rungState(ki, 0)) return;
    if(d.r1 === K.r1.w){ s.rung[`${ki}-0`] = "ok"; save(); good(); render(true); }
    else { b.classList.add("wrong"); m.className = "msg ng"; m.textContent = "✗ 아쉬워요. 빈칸 바로 뒤에 오는 말을 잘 보고 다시 골라요."; }
    return;
  }
  if(d.tile !== undefined){
    const ki = +d.tile, i = +d.i, arr = s.tiles[ki] = s.tiles[ki] || [];
    if(rungState(ki, 2)) return;
    if(d.inSlot) arr.splice(arr.indexOf(i), 1); else arr.push(i);
    save(); drawTiles(ki); return;
  }
  if(d.clear !== undefined){ s.tiles[+d.clear] = []; save(); drawTiles(+d.clear); return; }
  if(d.first !== undefined){
    const K = L.keys[+d.first], m = document.getElementById(`msg-${d.first}-3`);
    m.className = "msg info"; m.textContent = `첫 낱말: ${K.r4.t.split(" ")[0]} … (모두 ${K.r4.t.split(" ").length}낱말)`; return;
  }
  if(d.chunk !== undefined){
    const K = L.keys[+d.chunk], m = document.getElementById(`msg-${d.chunk}-3`);
    const words = K.r4.t.split(" "), order = shuffled(words.length, 11 + (+d.chunk) * 5 + (+cur) * 17);
    m.className = "msg info"; m.textContent = `낱말 카드(순서 섞임): ` + order.map(i => words[i]).join("  /  ");
    return;
  }
  if(d.chk){
    const [ki, r] = d.chk.split("-").map(Number), K = L.keys[ki], m = document.getElementById(`msg-${ki}-${r}`);
    const key = `${ki}-${r}`;
    let ok = false;
    if(r === 1) ok = norm(s.inp[key]) === norm(K.r2.w);
    if(r === 2){
      const arr = s.tiles[ki] || [];
      if(arr.length < K.r3.length){ m.className = "msg ng"; m.textContent = "덩어리를 모두 놓아야 확인할 수 있어요."; return; }
      ok = arr.every((v,i) => v === i);
      if(!ok){ const wrong = arr.filter((v,i) => v !== i).length; m.className = "msg ng"; m.textContent = `✗ ${wrong}개 덩어리의 자리가 달라요. 우리말 순서가 아니라 영어 순서(주어 → 동사 → …)를 떠올려요.`; }
    }
    if(r === 3){
      const v = s.inp[key] || "", targets = [K.r4.t, ...(K.r4.alt || [])];
      ok = targets.some(t => norm(t) === norm(v));
      if(!ok){
        const a = toks(v), bT = toks(K.r4.t), {hit, common} = lcsMark(a, bT);
        document.getElementById("diff-"+ki).innerHTML = a.length ? `내가 쓴 문장: ` + a.map((w,i) => `<span class="${hit[i]?"g":"r"}">${esc(w)}</span>`).join("") : "";
        const miss = bT.length - common;
        m.className = "msg ng"; m.textContent = !a.length ? "먼저 영어로 써 보세요." : `초록 낱말은 맞아요. 빨간 낱말을 고치고` + (miss > 0 ? `, 빠진 낱말 ${miss}개를 채워요.` : ` 순서를 확인해요.`);
      }
    }
    if(ok){ s.rung[key] = "ok"; save(); good(); render(true); return; }
    s.tries[key] = (s.tries[key] || 0) + 1; save();
    if(r === 1){ m.className = "msg ng"; m.textContent = `✗ 다시 써 보세요. 첫 글자 ${K.r2.w[0]}, 끝 글자 ${K.r2.w.slice(-1)}, ${K.r2.w.length}글자예요.`; }
    if(s.tries[key] >= 2) addSee(b, `data-see="${key}"`);
    return;
  }
  if(d.see){
    const [ki, r] = d.see.split("-").map(Number), K = L.keys[ki];
    s.rung[d.see] = "seen";
    if(r === 1) s.inp[d.see] = K.r2.w;
    if(r === 2) s.tiles[ki] = K.r3.map((_,i) => i);
    if(r === 3) s.inp[d.see] = K.r4.t;
    save(); render(true); return;
  }

  // STEP 3
  if(d.ev !== undefined){
    const qi = +d.ev, Q = L.cx.qs[qi], q = s.q3[qi] = s.q3[qi] || {}, m = document.getElementById("ev-"+qi);
    if(q.found) return;
    if(d.no === Q.ev){
      q.found = 1; save(); b.classList.add("right"); m.className = "msg ok"; m.textContent = "✓ 근거 문장을 찾았어요! 이제 그 문장만 보고 답해요.";
      glow(Q.ev); document.getElementById("ans-"+qi).classList.remove("hide");
    } else { b.classList.add("wrong"); m.className = "msg ng"; m.textContent = "힌트: " + Q.find; }
    return;
  }
  if(d.q3 !== undefined){
    const qi = +d.q3, Q = L.cx.qs[qi], q = s.q3[qi], m = document.getElementById("q3m-"+qi);
    if(q.done) return;
    if(+d.j === Q.ans){ q.done = 1; save(); good(); b.classList.add("right"); m.className = "msg ok"; m.textContent = "✓ 정답! " + (Q.why || ""); drawTabs(); setTimeout(() => render(true), 1200); }
    else { b.classList.add("wrong"); m.className = "msg ng"; m.textContent = "다시! 근거 문장 " + Q.ev + "을(를) 한 번 더 읽어 보세요."; glow(Q.ev); }
    return;
  }
  if(d.q3chk !== undefined){
    const qi = +d.q3chk, Q = L.cx.qs[qi], q = s.q3[qi], m = document.getElementById("q3m-"+qi);
    if(Q.a.some(a => norm(a) === norm(q.v))){ q.done = 1; save(); good(); render(true); return; }
    q.tries = (q.tries || 0) + 1; save();
    m.className = "msg ng"; m.textContent = "✗ 철자를 확인해요. 힌트 버튼을 눌러 보세요.";
    if(q.tries >= 2) addSee(b, `data-q3see="${qi}"`);
    return;
  }
  if(d.q3hint !== undefined){ const Q = L.cx.qs[+d.q3hint], m = document.getElementById("q3m-"+d.q3hint); m.className = "msg info"; m.textContent = "힌트: " + Q.hint; return; }
  if(d.q3see !== undefined){ const qi = +d.q3see, Q = L.cx.qs[qi], q = s.q3[qi]; q.v = Q.a[0]; q.done = 1; save(); render(true); return; }
});
["cls","num","nm"].forEach(id => {
  const el = document.getElementById(id); el.value = (S.who || {})[id] || "";
  el.addEventListener("input", () => { S.who = S.who || {}; S.who[id] = el.value; save(); });
});

/* 자료 점검: 핵심 문장·덩어리가 원문과 같은지 확인 */
Object.entries(LES).forEach(([k,L]) => {
  const M = sentMap(k);
  L.keys.forEach(K => {
    const src = plain(M[K.no].tk);
    if(src !== K.full) console.warn("원문 불일치", k, K.no);
    if(K.r3.join(" ") !== K.full) console.warn("덩어리 불일치", k, K.no);
    const r4 = (K.r4.pre ? K.r4.pre + " " : "") + K.r4.t + (/^[.,]/.test(K.r4.post) ? "" : " ") + K.r4.post;
    if(r4 !== K.full) console.warn("4칸 불일치", k, K.no);
  });
  L.cx.alt.forEach(a => { if(!plain(M[a[0]].tk).includes(a[1])) console.warn("복합 문제 치환 실패", k, a); });
});
render();
